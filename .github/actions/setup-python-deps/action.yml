name: Setup Python dependencies
description: Install Python dependencies from one or more requirements files with pip caching.
# cspell:ignore pipefail

inputs:
  requirements-files:
    description: Newline-separated requirements files to install in order.
    required: true
  python-version:
    description: Python version to set up.
    required: false
    default: "3.11"

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        REQUIREMENTS_FILES: ${{ inputs.requirements-files }}
      run: |
        set -euo pipefail

        if [ -z "$REQUIREMENTS_FILES" ]; then
          echo "requirements-files must not be empty" >&2
          exit 1
        fi

        IFS=$' \t\r\n' read -r -d '' -a requirements_files < <(printf '%s\0' "$REQUIREMENTS_FILES")

        if [ "${#requirements_files[@]}" -eq 0 ]; then
          echo "requirements-files must include at least one file" >&2
          exit 1
        fi

        invalid_requirements_files=()
        for requirements_file in "${requirements_files[@]}"; do
          if [ ! -f "$requirements_file" ] || [ ! -r "$requirements_file" ]; then
            invalid_requirements_files+=("$requirements_file")
          fi
        done

        if [ "${#invalid_requirements_files[@]}" -ne 0 ]; then
          printf 'requirements-files contains missing or unreadable file(s): %s\n' "${invalid_requirements_files[*]}" >&2
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # actions/setup-python v6.2.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.requirements-files }}

    - name: Install dependencies
      shell: bash
      env:
        REQUIREMENTS_FILES: ${{ inputs.requirements-files }}
      run: |
        set -euo pipefail

        IFS=$' \t\r\n' read -r -d '' -a requirements_files < <(printf '%s\0' "$REQUIREMENTS_FILES")

        for requirements_file in "${requirements_files[@]}"; do
          python -m pip install -r "$requirements_file"
        done
