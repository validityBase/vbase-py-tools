name: Python Dependency Locks

on:
  pull_request:
    paths:
      - "requirements/**"
      - "setup.py"
      - "MANIFEST.in"
      - ".github/workflows/python-dependency-locks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-tooling:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # actions/checkout v5.0.1

      - name: Install lock tooling
        uses: validityBase/vbase-github-actions/.github/actions/setup-python-deps@v1
        with:
          requirements-files: |
            requirements/tools.txt
          python-version: "3.11"
          require-hashes: "true"

      - name: Regenerate lock tooling lock
        run: pip-compile --strip-extras --no-annotate --allow-unsafe --generate-hashes -o requirements/tools.txt requirements/tools.in

      - name: Verify lock tooling lock is committed
        run: git diff --exit-code -- requirements/tools.txt

  development-locks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # actions/checkout v5.0.1

      - name: Install lock tooling
        uses: validityBase/vbase-github-actions/.github/actions/setup-python-deps@v1
        with:
          requirements-files: |
            requirements/tools.txt
          python-version: "3.11"
          require-hashes: "true"

      - name: Regenerate development dependency lock
        run: pip-compile --strip-extras --no-annotate --allow-unsafe --generate-hashes -o requirements/dev.txt requirements/dev.in

      - name: Verify development dependency lock is committed
        run: git diff --exit-code -- requirements/dev.txt

      - name: Install development dependencies
        uses: validityBase/vbase-github-actions/.github/actions/setup-python-deps@v1
        with:
          requirements-files: |
            requirements/dev.txt
          python-version: "3.11"
          require-hashes: "true"

      - name: Install package metadata
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Check installed dependencies
        run: python -m pip check

  docs-locks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # actions/checkout v5.0.1

      - name: Install lock tooling
        uses: validityBase/vbase-github-actions/.github/actions/setup-python-deps@v1
        with:
          requirements-files: |
            requirements/tools.txt
          python-version: "3.11"
          require-hashes: "true"

      - name: Regenerate docs dependency lock
        run: pip-compile --strip-extras --no-annotate --generate-hashes -o requirements/docs.txt requirements/docs.in

      - name: Verify docs dependency lock is committed
        run: git diff --exit-code -- requirements/docs.txt

      - name: Install docs dependencies
        uses: validityBase/vbase-github-actions/.github/actions/setup-python-deps@v1
        with:
          requirements-files: |
            requirements/docs.txt
          python-version: "3.11"
          require-hashes: "true"
